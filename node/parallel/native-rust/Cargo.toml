[package]
name = "parallel-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"

# Idiomatic variants: each workload's src/bin/<name>.rs is its parity version
# (the same algorithm and allocation pattern as the TypeScript); a workload whose
# idiomatic Rust differs also has src/idiomatic/<name>.rs, built as
# <name>-idiomatic.
[[bin]]
name = "sort-idiomatic"
path = "src/idiomatic/sort.rs"

[[bin]]
name = "strings-idiomatic"
path = "src/idiomatic/strings.rs"
